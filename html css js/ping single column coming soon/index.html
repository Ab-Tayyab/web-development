<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ping coming soon</title>
    <link rel="stylesheet" href="style.css" />
    <link
      rel="shortcut icon"
      href="./icon/favicon-32x32.png"
      type="image/x-icon"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
  </head>
  <body>
    <div class="container">
      <img src="./icon/logo.svg" alt="logo" class="logo" />
      <h1>We are launching <span>soon!</span></h1>
      <p>Subcribed and get notified</p>
      <form id="notifyForm">
        <div class="input-group">
          <input type="email" id="email" placeholder="Your email address..." />
          <small id="error-message"></small>
        </div>

        <button type="submit">Notify Me</button>
      </form>
      <img
        class="dashboard"
        src="./icon/illustration-dashboard.png"
        alt="illustration-dashboard"
      />
      <div class="social-icons">
        <i class="fa-brands fa-facebook-f"></i>
        <i class="fa-brands fa-twitter"></i>
        <i class="fa-brands fa-instagram"></i>
      </div>
      <p class="copyright">©Copyright Ping. All right reserved.</p>
    </div>
    <script src="./script.js"></script>
  </body>
</html>
