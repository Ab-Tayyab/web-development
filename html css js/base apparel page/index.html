<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Base Apparel Page</title>
    <link rel="stylesheet" href="./style.css" />
    <link
      rel="shortcut icon"
      href="./icon/favicon-32x32.png"
      type="image/x-icon"
    />
  </head>
  <body>
    <div class="container">
      <div class="content">
        <img class="logo" src="./icon/logo.svg" alt="logo" />
        <h1 class="h1">WE'RE</h1>
        <h1>COMING</h1>
        <h1>SOON</h1>
        <p>
          Hello fellow shoppers! We're currently building our new fashion store.
          Add your email below to stay up-to-date with announcments and our
          launch deals.
        </p>
        <form action="" id="form">
          <input
            type="text"
            id="email"
            placeholder="Enter your Email"
            autocomplete="off"
          />
          <button type="submit">></button>
        </form>
        <p id="output"></p>
      </div>
      <div>
        <div class="dp-img">
          <img
            class="hero-img1"
            src="./icon/hero-desktop.jpg"
            alt="hero-desktop"
          />
          <img class="hero-img2" src="./icon/hero-mobile.jpg" alt="">
        </div>
      </div>
    </div>
    <script src="./script.js"></script>
  </body>
</html>
